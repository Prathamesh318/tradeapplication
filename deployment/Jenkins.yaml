pipeline{
	agent any
	
	tools {
		maven "mvn"
	}
	stages {
		stage ('Build'){
			steps{
			
			// get code from github
			git url: 'https://github.com/Prathamesh318/tradeapplication.git'
			
			script{
				if(isUnix()){
					sh "mvn clean package"
				}
				else{
					bat "mvn clean package"
				}
			}
			}
		}
		stage('Integration Test'){
			steps{
			script{
				if(isUnix()){
					sh "mvn clean verify"
				}
				else{
					bat "mvn clean verify"
				}
			}
			}
		}
		stage('Build Docker Image and Push Image To Hub'){
			steps{
			script{
				if(isUnix()){
					sh "docker build -t prathamesh318/tradeimg:latest . --push"
				}
				else{
					bat "docker build -t prathamesh318/tradeimg:latest . --push"
				}
			}
			}
		}
		stage('Deploy To Cloud'){
			steps{
			script{
				if(isUnix()){
					sh "kubectl apply -f deployment"
				}
				else{
					bat "kubectl apply -f deployment"
				}
			}
			}
		}
		
	}
	post{
		success{
			jacoco(
				classPattern: '**/target/classes',
				sourcePattern: '**/src/main/java'
			)
			junit '**/target/surefire-reports/TEST-*.xml'
			archiveArtifacts 'target/*.jar'
		}
	}
}
